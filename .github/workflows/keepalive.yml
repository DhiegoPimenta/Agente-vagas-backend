name: Keep backend awake

# O Render free dorme apos ~15 min sem request, e o estado em memoria/tmp nao
# sobrevive ao sono -> quem abrir primeiro paga uma recarga completa (minutos).
# Esse ping evita que ele durma: roda a cada 5 min, bem dentro da janela de 15.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        run: curl -fsS --max-time 60 https://agente-vagas-backend.onrender.com/healthz || true
